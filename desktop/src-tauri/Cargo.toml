[package]
name = "squitle"
version = "0.1.0"
description = "Schedule quickly in TimeLine"
authors = ["Squitle contributors"]
edition = "2021"

[lib]
name = "squitle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
