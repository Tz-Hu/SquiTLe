<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squitle · macOS</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <header><span class="mark"><img src="./squitle-pixel.png" alt="" /></span><div><h1>Squitle</h1><p>Schedule quickly in TimeLine · macOS 本地文档原型</p></div></header>
    <section class="card">
      <div class="actions"><button id="open">选择排期文件</button><button id="save" disabled>安全写回</button></div>
      <p id="path">尚未选择文件</p>
      <dl>
        <div><dt>文档 ID</dt><dd id="document-id">—</dd></div>
        <div><dt>修订版本</dt><dd id="revision">—</dd></div>
        <div><dt>最后更新</dt><dd id="updated-at">—</dd></div>
      </dl>
      <p class="status" id="status">选择网页导出的 JSON，验证桌面端本地文件读写。</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
